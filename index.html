<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우주항공 기업 경영 시뮬레이션</title>
<style>
:root{--bg:#0b1020;--panel:#151d33;--line:#2a3658;--text:#e6ebff;--sub:#8b96bd;--acc:#4ea8ff;--ok:#43d17a;--bad:#ff6b6b;--warn:#ffc857}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;font-size:15px;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:5}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;max-width:1100px;margin:0 auto}
main{padding:16px;max-width:1100px;margin:0 auto;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h3{margin:0 0 8px;font-size:16px}
button{background:var(--acc);color:#06142b;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:14px}
button:disabled{background:#33405f;color:#7c87a8;cursor:not-allowed}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.bar{height:8px;background:#0c1328;border-radius:4px;overflow:hidden;margin:6px 0}
.bar>div{height:100%;background:var(--acc)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.sub{color:var(--sub);font-size:13px}
.big{font-size:22px;font-weight:700}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#22305a;margin-right:4px}
.bad{color:var(--bad)} .ok{color:var(--ok)} .warn{color:var(--warn)}
input,select{background:#0c1328;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px;width:100%}
.opt{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.opt label{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.opt input{width:auto}
#msg{color:var(--warn);font-size:13px;min-height:18px;padding:0 16px;max-width:1100px;margin:0 auto}
.wrap{max-width:560px;margin:30px auto;padding:0 16px}
@media (max-width:600px){main{padding:10px}.big{font-size:18px}}
#scene{flex:0 0 50%;min-height:0;position:relative;background:linear-gradient(#0b1a3a,#1d2c55 72%,#1e2f1e 72%);border-bottom:2px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px 14px;z-index:1}
#scene svg{flex:1;width:100%;min-height:0}
.sc-status{position:absolute;left:12px;bottom:8px;font-size:13px;color:#cfe0ff;background:rgba(11,16,32,.7);padding:4px 10px;border-radius:8px}
.btn-new{background:#ff8a4c;color:#1a0d00}
button{touch-action:manipulation;min-height:36px;-webkit-tap-highlight-color:transparent}
.sc-result{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-weight:700;background:rgba(11,16,32,.85);padding:6px 14px;border-radius:8px;white-space:nowrap;font-size:15px}
#panel{flex:1 1 50%;min-height:0;overflow-y:auto;background:var(--bg)}
#panel nav{position:sticky;top:0;background:var(--bg);z-index:2;padding:8px 12px;margin:0;max-width:none;border-bottom:1px solid var(--line)}
#panel #msg{padding:6px 12px 0;margin:0;max-width:none}
#panel main{padding:10px 12px;max-width:none}
</style>
</head>
<body>
<div id="scene"></div>
<div id="panel">
  <nav id="nav"></nav>
  <div id="msg"></div>
  <div id="app"></div>
</div>

<script>
/* ===== 확정 규칙 및 밸런스 상수 ===== */
const SAVE_KEY='space_tycoon_v1';
const C={FAIL_BASE:0.30,LOAN_RATE:0.01,MAX_LEVEL:10,FREE_RECRUIT_CD:600,PAID_RECRUIT:50000,MAX_TEAMS:8,LAUNCH_SEC:30,CONTRACT_GEN_SEC:30,MAX_OFFERS:6,MAX_ROCKETS:3,MAX_ACCEPTED:8};
const PARTS={s1:{name:'1단 로켓',team:'1단 로켓팀'},s2:{name:'2단 로켓',team:'2단 로켓팀'},eng:{name:'엔진',team:'엔진팀'},cargo:{name:'화물 공간',team:'화물팀'}};
const KEYS=Object.keys(PARTS);
const GRADES=[{n:'일반',w:50,m:1},{n:'고급',w:30,m:1.2},{n:'희귀',w:14,m:1.5},{n:'영웅',w:5,m:1.8},{n:'전설',w:1,m:2.5}];
const TYPES={private:{name:'민간 스타트업',funds:5000000,desc:'초기 자본 적음 · 자유도 높음 · 투자 유치 가능(예정)'},state:{name:'국영 우주기업',funds:20000000,desc:'초기 자본 많음 · 정부 지원 (국가 임무는 예정)'}};
const TABS=[['dash','대시보드'],['research','연구'],['team','인력'],['build','로켓 제작'],['contract','계약·발사'],['finance','자금·대출'],['info','회사·미구현']];
const CONTRACT_NAMES=['통신위성 발사','관측위성 발사','우주 화물 운송','보급품 운송','항법위성 발사'];
// 궤도별 필요 엔진 레벨과 보상 배율
const ORBIT={'저궤도':{req:1,mult:1},'고궤도':{req:3,mult:1.8},'달 궤도':{req:5,mult:2.8}};

/* ===== 공식 ===== */
const rCost=lvl=>60000*(lvl+1)*(lvl+1);    // 연구 비용
const rTime=lvl=>60*(lvl+1);               // 연구 시간(초)
const bCost=lvl=>30000*(lvl+1);            // 부품 제작비
const bTime=lvl=>20*(lvl+1);               // 부품 제작 시간(초)
const salaryPerSec=t=>t.size*GRADES[t.grade].m*8000/3600; // 인건비(실시간)
const xpNeed=l=>l*120;
const capacity=r=>r.slots.cargo*1500+r.slots.eng*500;
const isReady=r=>KEYS.every(k=>r.slots[k]!==null);
const failFrom=lv=>{const avg=lv.reduce((a,b)=>a+b,0)/lv.length;return Math.max(0.05,C.FAIL_BASE-(avg-1)*0.02);};
const failChance=r=>failFrom(KEYS.map(k=>r.slots[k]));
// 로켓 전체 계획: 장착·제작 중인 부품은 확정 레벨, 미착수 부품은 선택한 레벨로 가정
function rocketPlan(r){
  const lv={};let cost=0;
  for(const k of KEYS){
    const b=S.builds.find(x=>x.rid===r.id&&x.part===k);
    if(r.slots[k]!==null) lv[k]=r.slots[k];
    else if(b) lv[k]=b.lvl;
    else{const sel=Math.min(S.lvl[k],Math.max(1,ui.bl[r.id+k]||S.lvl[k]));lv[k]=sel;cost+=bCost(sel)}
  }
  return {cost,cap:lv.cargo*1500+lv.eng*500,pct:Math.round(failFrom(KEYS.map(k=>lv[k]))*100)};
}
function planLine(r){
  const p=rocketPlan(r);
  return `<div class="sub">필요 금액 ${p.cost>0?fmt(p.cost):'없음(완성)'} · 적재량 ${p.cap.toLocaleString('ko-KR')}kg · 폭발 확률 ${p.pct}%</div>`;
}
const fmt=n=>'$'+Math.round(n).toLocaleString('ko-KR');
const fmtT=s=>{s=Math.max(0,Math.ceil(s));const m=Math.floor(s/60),r=s%60;return m?`${m}분 ${r}초`:`${r}초`};
const remain=end=>(end-Date.now())/1000;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const gradeIdx=()=>{let r=Math.random()*100,a=0;for(let i=0;i<GRADES.length;i++){a+=GRADES[i].w;if(r<a)return i}return 0};

/* ===== 상태 ===== */
let S=null;
const ui={tab:'dash',msg:'',amt:'1000000',setupName:'',bl:{}};

function newState(name,type){
  const s={v:1,name,type,level:1,xp:0,funds:TYPES[type].funds,loan:0,
    lastTick:Date.now(),lastFree:0,lastGen:Date.now(),nextGen:Date.now()+C.CONTRACT_GEN_SEC*1000,
    lvl:{s1:1,s2:1,eng:1,cargo:1},   // 시작: 4종 부품 모두 Lv.1 기초 연구 완료
    research:{},teams:[],builds:[],rockets:[],offers:[],accepted:[],flight:null,log:[],nextId:1};
  for(let i=0;i<3;i++) s.offers.push(newContract(s));
  return s;
}
function newContract(s){
  const cap=300+s.level*200;
  const w=Math.round((200+Math.random()*(cap-200))/100)*100;
  const open=Object.keys(ORBIT).filter(o=>ORBIT[o].req<=s.lvl.eng);
  const dest=rnd(open);
  return {id:s.nextId++,name:rnd(CONTRACT_NAMES),weight:w,reward:Math.round(w*(250+s.level*25)*ORBIT[dest].mult),dest};
}
function uid(){return S.nextId++}
function log(m){S.log.unshift(`[${new Date().toLocaleTimeString('ko-KR')}] ${m}`);S.log.length=Math.min(S.log.length,30)}
function addXp(x){
  S.xp+=x;
  while(S.xp>=xpNeed(S.level)){S.xp-=xpNeed(S.level);S.level++;S.funds+=50000;log(`회사 레벨 ${S.level} 달성! 보너스 ${fmt(50000)}`)}
}
const findC=id=>S.offers.find(c=>c.id===id)||S.accepted.find(c=>c.id===id);
const findR=id=>S.rockets.find(r=>r.id===id);

/* ===== 게임 로직 ===== */
function startResearch(k){
  const now=Date.now();
  if(S.research[k]) return '이미 연구 중입니다.';
  const lvl=S.lvl[k];
  if(lvl>=C.MAX_LEVEL) return '최대 단계에 도달했습니다.';
  const cost=rCost(lvl);
  if(S.funds<cost) return '자금이 부족합니다.';
  let t=rTime(lvl);
  let team=S.teams.find(x=>x.kind===k&&!x.task),tid=null;
  if(team){t*=Math.max(0.25,0.5-0.05*team.grade);team.task='research:'+k;tid=team.id}
  S.funds-=cost;
  S.research[k]={end:now+t*1000,target:lvl+1,team:tid};
  log(`${PARTS[k].name} 연구 시작 (Lv.${lvl+1}) ${team?'· '+PARTS[k].team+' 배정':''}`);
  return null;
}
function recruit(paid){
  if(S.teams.length>=C.MAX_TEAMS) return `팀은 최대 ${C.MAX_TEAMS}개까지 운영할 수 있습니다.`;
  const now=Date.now();
  if(!paid && now-S.lastFree<C.FREE_RECRUIT_CD*1000) return `무료 모집 대기: ${fmtT(C.FREE_RECRUIT_CD-(now-S.lastFree)/1000)}`;
  if(paid && S.funds<C.PAID_RECRUIT) return '자금이 부족합니다.';
  if(paid) S.funds-=C.PAID_RECRUIT; else S.lastFree=now;
  const g=gradeIdx();
  const t={id:uid(),kind:rnd(KEYS),grade:g,size:2+g+Math.floor(Math.random()*3),task:null};
  S.teams.push(t);
  log(`${GRADES[g].n} 등급 ${PARTS[t.kind].team} 모집 (${t.size}명)`);
  return null;
}
function fireTeam(tid){
  const i=S.teams.findIndex(t=>t.id===tid);
  if(i<0) return '팀을 찾을 수 없습니다.';
  const t=S.teams[i];
  if(t.task) return '연구 배정 중인 팀은 해고할 수 없습니다. 연구가 끝난 뒤 해고하세요.';
  S.teams.splice(i,1);
  log(`${PARTS[t.kind].team} 해고 (${t.size}명)`);
  return null;
}
function newRocket(){
  const unfinished=S.rockets.filter(r=>!isReady(r)).length;
  if(unfinished>=C.MAX_ROCKETS) return `동시에 조립 가능한 로켓은 ${C.MAX_ROCKETS}개입니다.`;
  S.rockets.push({id:uid(),slots:{s1:null,s2:null,eng:null,cargo:null}});
  log('새 로켓 조립을 시작했습니다.');
  return null;
}
function build(rid,k,lvl){
  const r=findR(rid);
  if(!r) return '로켓을 찾을 수 없습니다.';
  if(r.slots[k]!==null) return '이미 장착된 부품입니다.';
  if(S.builds.some(b=>b.rid===rid&&b.part===k)) return '이미 제작 중입니다.';
  if(!lvl||lvl<1||lvl>S.lvl[k]) return `${PARTS[k].name} 연구가 필요하거나 제작 레벨이 잘못되었습니다.`;
  const cost=bCost(lvl);
  if(S.funds<cost) return '자금이 부족합니다.';
  S.funds-=cost;
  S.builds.push({id:uid(),rid,part:k,lvl,end:Date.now()+bTime(lvl)*1000});
  log(`${PARTS[k].name} Lv.${lvl} 제작 시작`);
  return null;
}
function rejectContract(cid){
  const i=S.offers.findIndex(c=>c.id===cid);
  if(i<0) return '계약을 찾을 수 없습니다.';
  const c=S.offers.splice(i,1)[0];
  log(`${c.name} 계약을 거절했습니다.`);
  return null;
}
function abandonContract(cid){
  const i=S.accepted.findIndex(c=>c.id===cid);
  if(i<0) return '계약을 찾을 수 없습니다.';
  if(S.flight&&S.flight.cids.includes(cid)) return '발사 중인 화물 계약은 포기할 수 없습니다.';
  const c=S.accepted.splice(i,1)[0];
  log(`${c.name} 계약을 포기했습니다.`);
  return null;
}
function accept(cid){
  if(S.accepted.length>=C.MAX_ACCEPTED) return `수락할 수 있는 임무는 최대 ${C.MAX_ACCEPTED}개입니다.`;
  const i=S.offers.findIndex(c=>c.id===cid);
  if(i<0) return '계약을 찾을 수 없습니다.';
  S.accepted.push(S.offers.splice(i,1)[0]);
  log('운송 계약을 수락했습니다.');
  return null;
}
function launch(orbit){
  if(S.flight) return '이미 발사 진행 중입니다.';
  const test=orbit==='시험';
  const need=test?0:ORBIT[orbit].req;
  const ready=S.rockets.filter(r=>isReady(r)&&r.slots.eng>=need).sort((a,b)=>capacity(a)-capacity(b));
  if(!ready.length) return test?'발사할 수 있는 완성 로켓이 없습니다.':`${orbit}은(는) 엔진 Lv.${need} 이상인 완성 로켓이 필요합니다.`;
  const pending=test?[]:S.accepted.filter(c=>c.dest===orbit).sort((a,b)=>b.weight-a.weight);
  if(!test&&!pending.length) return `${orbit} 목적지의 수락 계약이 없습니다.`;
  const total=pending.reduce((a,c)=>a+c.weight,0);
  // 같은 궤도 화물을 모두 실을 수 있는 가장 작은 로켓 우선, 없으면 가장 큰 로켓에 가능한 만큼 적재
  const rocket=ready.find(r=>capacity(r)>=total)||ready[ready.length-1];
  let left=capacity(rocket);const loaded=[];
  for(const c of pending){if(c.weight<=left){loaded.push(c.id);left-=c.weight}}
  if(!test&&!loaded.length) return '화물을 실을 수 있는 완성 로켓이 없습니다.';
  const start=Date.now();
  S.flight={cids:loaded,rid:rocket.id,orbit,start,end:start+C.LAUNCH_SEC*1000,fail:Math.random()<failChance(rocket),failAt:2+Math.floor(Math.random()*5)};
  log(test?`시험 발사 (로켓 #${rocket.id})`:`${orbit} 발사: ${loaded.length}건 화물 탑재 (로켓 #${rocket.id})`);
  return null;
}
function borrow(){
  const a=Math.floor(Number(ui.amt)||0);
  if(a<=0) return '금액을 입력하세요.';
  const avail=S.level*1000000-S.loan;
  if(a>avail) return `대출 한도 초과 (남은 한도 ${fmt(Math.max(0,avail))})`;
  S.loan+=a;S.funds+=a;log(`${fmt(a)} 대출`);return null;
}
function repay(){
  const a=Math.min(Math.floor(Number(ui.amt)||0),Math.floor(S.loan),Math.floor(S.funds));
  if(a<=0) return '상환할 수 없습니다 (금액 또는 자금 확인).';
  S.loan-=a;S.funds-=a;log(`${fmt(a)} 상환`);return null;
}

/* ===== 실시간 틱 (백그라운드 진행 포함, 접속 시 경과 시간 일괄 처리) ===== */
function tick(){
  const now=Date.now();
  const dt=(now-S.lastTick)/1000;
  if(dt<=0) return;
  S.lastTick=now;
  // 인건비 & 고정 1% 이자 (시간당)
  S.funds-=S.teams.reduce((a,t)=>a+salaryPerSec(t),0)*dt;
  if(S.loan>0) S.loan+=S.loan*C.LOAN_RATE*dt/3600;
  // 연구 완료
  for(const k of KEYS){
    const r=S.research[k];
    if(r&&r.end<=now){
      S.lvl[k]=r.target;
      const t=S.teams.find(x=>x.id===r.team);
      if(t) t.task=null;
      delete S.research[k];
      addXp(50+r.target*30);
      log(`${PARTS[k].name} Lv.${r.target} 연구 완료`);
    }
  }
  // 부품 제작 완료 → 로켓에 바로 장착
  S.builds=S.builds.filter(b=>{
    if(b.end>now) return true;
    const r=findR(b.rid);
    if(r){r.slots[b.part]=b.lvl;addXp(10+b.lvl*5);log(`${PARTS[b.part].name} 장착 완료`)}
    return false;
  });
  // 발사 결과
  if(S.flight&&S.flight.end<=now){
    const f=S.flight;S.flight=null;
    const r=findR(f.rid);
    const cs=S.accepted.filter(x=>f.cids.includes(x.id));
    S.rockets=S.rockets.filter(x=>x.id!==f.rid);
    if(r){
      S.accepted=S.accepted.filter(x=>!f.cids.includes(x.id));
      if(f.fail){
        S.offers.push(...cs);
        log(`발사 실패! 로켓과 화물 손실.${cs.length?' 계약은 다시 게시됩니다.':''}`);
        S.result={ok:false,t:Date.now(),msg:'발사 실패! 로켓과 화물 손실'};
      }else{
        const pay=cs.reduce((a,c)=>a+c.reward,0);
        S.funds+=pay;addXp(50+cs.length*50+Math.round(pay/20000));
        log(cs.length?`발사 성공! ${cs.length}건 임무 완수, 보상 ${fmt(pay)} 지급`:'시험 발사 성공 (경험치 획득)');
        S.result={ok:true,t:Date.now(),msg:cs.length?`발사 성공! ${cs.length}건 임무 완수 (+${fmt(pay)})`:'시험 발사 성공'};
      }
    }
  }
  // 새 계약 생성
  if(S.offers.length<C.MAX_OFFERS&&now>=(S.nextGen||0)){
    S.offers.push(newContract(S));
    S.nextGen=now+C.CONTRACT_GEN_SEC*(0.5+Math.random())*1000;
  }
}

/* ===== 저장 / 불러오기 ===== */
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');

  }catch(e){S=null}
}

const STARS='<circle cx="30" cy="25" r="1.2" fill="#fff"/><circle cx="90" cy="60" r="1" fill="#fff"/><circle cx="160" cy="20" r="1.4" fill="#fff"/><circle cx="330" cy="40" r="1" fill="#fff"/><circle cx="370" cy="90" r="1.3" fill="#fff"/><circle cx="220" cy="70" r="1" fill="#fff"/>';
const GROUND='<rect x="0" y="184" width="400" height="16" fill="#1e2f1e"/>';

const STAGES=['발사대 최종 점검','카운트다운','엔진 점화 및 이륙','대기권 돌파','1단 분리','2단 엔진 점화','궤도 진입','화물 분리 및 결과 발표'];
const PART_COL={s1:'#e6ebff',s2:'#cfd8ee',eng:'#ff9f43',cargo:'#4ea8ff'};
const PSTY=(on,col)=>on?`fill="${col}"`:'fill="none" stroke="#6a7699" stroke-dasharray="3 3"';
// 장착 여부와 레벨: 장착 부품은 장착 레벨, 제작 중은 제작 레벨, 미착수는 선택 레벨
function levelsOf(r){
  const lv={},filled={};
  for(const k of KEYS){
    const b=S.builds.find(x=>x.rid===r.id&&x.part===k);
    filled[k]=r.slots[k]!==null;
    if(filled[k]) lv[k]=r.slots[k];
    else if(b) lv[k]=b.lvl;
    else lv[k]=Math.min(S.lvl[k],Math.max(1,ui.bl[r.id+k]||S.lvl[k]));
  }
  return {lv,filled};
}
// 부품 레벨 → 형상 치수 (5단계 이후는 외형 고정)
function partGeo(L0){
  const L={};for(const k of KEYS) L[k]=Math.min(L0[k],5);
  const eng={n:L.eng<=2?1:L.eng<=4?2:4,w:10+L.eng*2,h:6+L.eng*2,lv:L.eng};
  const s1={len:30+L.s1*4,d:22+L.s1*2,fins:L.s1<=2?0:L.s1<=4?4:6,fo:4+L.s1,ribs:L.s1>=4};
  const s2={len:22+L.s2*3,d:Math.min(18+L.s2*1.5,s1.d-2),lv:L.s2};
  const cg={len:18+L.cargo*2,d:s2.d,shape:L.cargo<=2?'cone':L.cargo<=4?'ogive':'blunt'};
  return {eng,s1,s2,cg};
}
// 각 연결면의 y 위치 (아래가 0, 위로 음수)
function ysOf(g){
  const yt1=-g.eng.h-g.s1.len, jt=yt1-3, yt2=jt-g.s2.len;
  return {yt1,jt,yt2};
}
function engSVG(g,on){
  const e=g.eng, nw=e.n===1?e.w:e.n===2?e.w*0.6:e.w*0.4;
  const xs=e.n===1?[0]:e.n===2?[-e.w*0.3,e.w*0.3]:[-e.w*0.75,-e.w*0.25,e.w*0.25,e.w*0.75];
  const top=nw*0.7;
  return xs.map(x=>`<polygon points="${x-top/2},${-e.h} ${x+top/2},${-e.h} ${x+nw/2},0 ${x-nw/2},0" ${PSTY(on,PART_COL.eng)}/>`
    +(e.lv>=3?`<ellipse cx="${x}" cy="-1" rx="${nw*0.25}" ry="1" fill="#1a1f30"/>`:'')).join('');
}
function s1SVG(g,on){
  const s=g.s1, yb=-g.eng.h, yt=yb-s.len, h2=s.d/2;
  let o=`<rect x="${-h2}" y="${yt}" width="${s.d}" height="${s.len}" ${PSTY(on,PART_COL.s1)}/>`;
  if(on&&s.fins){
    const fin=sg=>`<polygon points="${sg*h2},${yb-s.len*0.5} ${sg*(h2+s.fo)},${yb} ${sg*h2},${yb}" fill="#9aa6c7"/>`;
    o+=fin(1)+fin(-1);
  }
  if(on&&s.ribs) for(let y=yt+8;y<yb-3;y+=9) o+=`<line x1="${-h2}" y1="${y}" x2="${h2}" y2="${y}" stroke="#9aa6c7" stroke-width="0.8"/>`;
  return o;
}
function s2SVG(g,on,ys){
  const s=g.s2, h2=s.d/2;
  // 연결 링: 1단과 2단 사이를 이어주는 부품 (2단 지름보다 살짝 넓음)
  let o=`<rect x="${-(h2+1)}" y="${ys.jt}" width="${s.d+2}" height="3" fill="#7d8aab"/>`;
  o+=`<rect x="${-h2}" y="${ys.yt2}" width="${s.d}" height="${s.len}" ${PSTY(on,PART_COL.s2)}/>`;
  if(on&&s.lv>=3) o+=`<line x1="${-h2}" y1="${ys.yt2+s.len/2}" x2="${h2}" y2="${ys.yt2+s.len/2}" stroke="#9aa6c7" stroke-width="0.8"/>`;
  return o;
}
function cgSVG(g,on,t){
  const c=g.cg, d=c.d/2, h=c.len;
  const p=c.shape==='cone'?`M${-d},${t} L0,${t-h} L${d},${t} Z`
    :c.shape==='ogive'?`M${-d},${t} C${-d},${t-h*0.7} ${-d*0.3},${t-h} 0,${t-h} C${d*0.3},${t-h} ${d},${t-h*0.7} ${d},${t} Z`
    :`M${-d},${t} L${-d},${t-h*0.55} Q${-d},${t-h} ${-d*0.5},${t-h} L${d*0.5},${t-h} Q${d},${t-h} ${d},${t-h*0.55} L${d},${t} Z`;
  return `<path d="${p}" ${PSTY(on,PART_COL.cargo)}/>`;
}
// 로켓 본체 (원점 = 노즐 바닥 중앙). A: 단계별 분리 애니메이션 값
function rocketBody(r,A){
  const {lv,filled}=levelsOf(r);
  const g=partGeo(lv), ys=ysOf(g);
  const a=Object.assign({lowDy:0,lowOp:1,midDy:0,midOp:1,cgDy:0,cgOp:1,low:true,mid:true,cg:true},A||{});
  const low=a.low?`<g transform="translate(0,${a.lowDy})" opacity="${a.lowOp}">${engSVG(g,filled.eng)}${s1SVG(g,filled.s1)}</g>`:'';
  const mid=a.mid?`<g transform="translate(0,${a.midDy})" opacity="${a.midOp}">${s2SVG(g,filled.s2,ys)}</g>`:'';
  const cg=a.cg?`<g transform="translate(0,${a.cgDy})" opacity="${a.cgOp}">${cgSVG(g,filled.cargo,ys.yt2)}</g>`:'';
  return low+mid+cg;
}
// 발사 장면: 단계별 분리와 불꽃
function rocketSVG(r,lift,flame,st,prog){
  const base=184+lift;
  const f=prog*8-Math.floor(prog*8);
  const g=partGeo(levelsOf(r).lv), ys=ysOf(g);
  const A={};
  if(st===4){A.lowDy=f*60;A.lowOp=(1-f).toFixed(2);}
  else if(st>=5){A.low=false;}
  if(st===6){A.midOp=(1-f).toFixed(2);}
  else if(st>=7){A.mid=false;}
  if(st===7){A.cgDy=-f*40;A.cgOp=(1-f).toFixed(2);}
  const fw=g.eng.w*0.8;
  const fBase=flame&&(st===2||st===3)?`<polygon points="${-fw/2},0 ${fw/2},0 0,${12+4*Math.sin(Date.now()/90)}" fill="#ffb347"/>`:'';
  const fS2=flame&&(st===5||st===6)?`<g opacity="${st===6?(1-f).toFixed(2):1}"><polygon points="${-g.s2.d*0.2},${ys.jt} ${g.s2.d*0.2},${ys.jt} 0,${ys.jt+8+3*Math.sin(Date.now()/70)}" fill="#ffd166"/></g>`:'';
  return `<g transform="translate(105,${base})">${fBase}${fS2}${rocketBody(r,A)}</g>`;
}
// 제작 화면 미리보기 (원점 기준 좌표)
function drawPreview(r){return `<g>${rocketBody(r,null)}</g>`;}
function renderScene(){
  const el=document.getElementById('scene');
  if(!S||ui.setup){
    el.innerHTML=`<div class="sc-top"><b>우주항공 기업 경영 시뮬레이션</b></div><svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMax meet">${STARS}${GROUND}</svg>`;
    return;
  }
  const fl=S.flight;
  const disp=(fl&&findR(fl.rid))||S.rockets.find(isReady)||S.rockets[0]||null;
  const prog=fl?Math.min(1,Math.max(0,(Date.now()-fl.start)/(fl.end-fl.start))):0;
  const st=Math.min(7,Math.floor(prog*8));
  const lift=fl?-Math.max(0,(prog-0.25)/0.75)*90:0;
  const boom=!!(fl&&fl.fail&&st>=fl.failAt);
  const bH=40+S.level*8;
  const status=fl?`${STAGES[st]} (${st+1}/8)`:(disp?(isReady(disp)?'발사 대기':'조립 중'):'로켓 없음');
  el.innerHTML=`<div class="sc-top"><div><div class="big ${S.funds<0?'bad':''}">${fmt(S.funds)}</div>
      <div><b>${esc(S.name)}</b> <span class="tag">${TYPES[S.type].name}</span><span class="tag">Lv.${S.level}</span></div></div>
      <button class="btn-new" data-act="newgame">새 게임</button></div>
    <svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMax meet">${STARS}
      <rect x="260" y="${200-bH}" width="100" height="${bH}" fill="#2c3d66"/>
      <rect x="272" y="${200-bH+10}" width="76" height="${bH-30}" fill="#3a527f"/>
      <rect x="282" y="${200-bH+18}" width="56" height="10" fill="#9fd3ff" opacity=".6"/>
      ${GROUND}
      <rect x="55" y="184" width="100" height="10" fill="#555f73"/>
      ${fl&&st===1?`<text x="200" y="70" text-anchor="middle" font-size="40" font-weight="700" fill="#ffc857">${3-Math.min(2,Math.floor((prog*8-1)*3))}</text>`:''}
      ${disp&&!boom?`<g>${rocketSVG(disp,lift,!!fl,st,prog)}</g>`:''}
      ${boom&&st<=fl.failAt+1?`<circle cx="105" cy="${184+lift-40}" r="${20+6*Math.sin(Date.now()/100)}" fill="#ff8a4c" opacity=".85"/><circle cx="105" cy="${184+lift-40}" r="${9+3*Math.sin(Date.now()/80)}" fill="#ffd166"/>`:''}
    </svg>
    <div class="sc-status">${esc(status)} · 완성 로켓 ${S.rockets.filter(isReady).length}기</div>
    ${S.result&&Date.now()-S.result.t<6000?`<div class="sc-result ${S.result.ok?'ok':'bad'}">${esc(S.result.msg)}</div>`:''}`;
}
function renderPanel(){
  const app=document.getElementById('app');
  document.getElementById('msg').textContent=ui.msg;
  if(!S||ui.setup){
    document.getElementById('nav').innerHTML='';
    app.innerHTML=setupHTML();
    return;
  }
  document.getElementById('nav').innerHTML=TABS.map(([k,n])=>`<button class="${ui.tab===k?'':'ghost'}" data-act="tab" data-k="${k}">${n}</button>`).join('');
  app.innerHTML=`<main>${PAGES[ui.tab]()}</main>`;
}
function render(){renderScene();renderPanel();}

document.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  const b=e.target.closest('[data-act]');
  if(!b||b.disabled) return;
  const a=b.dataset.act,id=Number(b.dataset.id),k=b.dataset.k;
  let err=null;
  if(a==='tab'){ui.tab=k}
  else if(a==='start'){
    const name=ui.setupName.trim();
    const type=(document.querySelector('input[name=ty]:checked')||{}).value||'private';
    if(!name){err='기업 이름을 입력하세요.'}
    else{S=newState(name,type);S.lastTick=Date.now();log(`${name} 설립 (${TYPES[type].name})`);save();ui.setup=false;ui.tab='dash';ui.setupName='';}
  }
  else if(a==='research') err=startResearch(k);
  else if(a==='recruit') err=recruit(b.dataset.paid==='1');
  else if(a==='newRocket') err=newRocket();
  else if(a==='fire') err=fireTeam(id);
  else if(a==='build') err=build(id,k,Number(b.dataset.lv));
  else if(a==='blUp'||a==='blDown'){const key=id+k;const cur=ui.bl[key]||S.lvl[k];ui.bl[key]=Math.max(1,Math.min(S.lvl[k],cur+(a==='blUp'?1:-1)));}
  else if(a==='accept') err=accept(id);
  else if(a==='reject') err=rejectContract(id);
  else if(a==='abandon') err=abandonContract(id);
  else if(a==='launch') err=launch(k);
  else if(a==='borrow') err=borrow();
  else if(a==='repay') err=repay();
  else if(a==='newgame'){ui.setup=true;ui.setupName='';ui.msg='';render();return;}
  else if(a==='cancelsetup'){ui.setup=false;ui.msg='';}
  ui.msg=err||'';
  if(S) save();
  render();
});

load();
if(!S) ui.setup=true;
setInterval(()=>{
  if(!S) return;
  tick();
  if(Date.now()-(S._saved||0)>5000){S._saved=Date.now();save();}
  renderScene();
  if(!ui.setup) renderPanel();
},1000);
setInterval(()=>{if(S&&!ui.setup&&(S.flight||S.result))renderScene();},200);
render();
</script>
